<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoCare LK — Sri Lanka Vehicle Service &amp; Compliance Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #F8FAFC;
      color: #0F172A;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes modalZoomIn {
      from { transform: scale(0.96) translateY(8px); opacity: 0; }
      to { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-modal-bg { animation: modalFadeIn 0.18s ease-out forwards; }
    .animate-modal-card { animation: modalZoomIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .sl-plate {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      border: 1.5px solid #1e293b;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 1px 2px rgba(0,0,0,0.06);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-blue-100 selection:text-blue-900">

  <!-- Top Navigation Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-wrap items-center justify-between gap-4 py-3.5">
        <!-- Brand Identity -->
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-sm">
            <i data-lucide="car-front" class="w-5 h-5"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg sm:text-xl font-extrabold tracking-tight text-slate-900">AutoCare <span class="text-blue-600">LK</span></h1>
              <span id="db-status-badge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200">
                <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
                <span>Local Mode</span>
              </span>
            </div>
            <p class="text-xs text-slate-500 hidden sm:block">Service Schedule, Motor Insurance, eRL &amp; VET Manager</p>
          </div>
        </div>

        <!-- Global Actions & Vehicle Controls -->
        <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
          <div class="relative">
            <select id="vehicle-dropdown" onchange="selectVehicle(this.value)" aria-label="Select Vehicle"
              class="appearance-none bg-slate-50 hover:bg-slate-100 border border-slate-300 text-slate-900 text-xs sm:text-sm font-bold rounded-xl pl-3.5 pr-9 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer transition">
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-slate-500 pointer-events-none absolute right-3 top-1/2 -translate-y-1/2"></i>
          </div>

          <button onclick="openVehicleModal()" class="inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.99] text-white text-xs sm:text-sm font-semibold px-3.5 py-2.5 rounded-xl shadow-xs transition cursor-pointer">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>Add Vehicle</span>
          </button>

          <button onclick="openSupabaseModal()" class="inline-flex items-center gap-1.5 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 text-xs sm:text-sm font-semibold px-3 py-2.5 rounded-xl transition cursor-pointer" title="Configure Supabase Central Database">
            <i data-lucide="cloud" class="w-4 h-4 text-emerald-600"></i>
            <span class="hidden md:inline">Supabase Sync</span>
          </button>

          <button onclick="openBackupModal()" class="inline-flex items-center gap-1.5 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 text-xs sm:text-sm font-semibold px-3 py-2.5 rounded-xl transition cursor-pointer" title="Export or Import JSON Backup">
            <i data-lucide="database-backup" class="w-4 h-4 text-slate-500"></i>
            <span class="hidden lg:inline">Backup</span>
          </button>
        </div>
      </div>

      <!-- Sub-Navigation Tabs + Quick Vehicle Pills -->
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-2 pb-2.5 pt-1 border-t border-slate-100">
        <nav class="flex items-center gap-1 overflow-x-auto no-scrollbar" aria-label="Primary Tabs">
          <button onclick="switchTab('overview')" id="nav-overview" class="nav-tab-btn inline-flex items-center gap-2 px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition cursor-pointer">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            <span>Overview &amp; Compliance</span>
          </button>
          <button onclick="switchTab('service')" id="nav-service" class="nav-tab-btn inline-flex items-center gap-2 px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition cursor-pointer">
            <i data-lucide="wrench" class="w-4 h-4"></i>
            <span>Service History</span>
          </button>
          <button onclick="switchTab('vault')" id="nav-vault" class="nav-tab-btn inline-flex items-center gap-2 px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition cursor-pointer">
            <i data-lucide="folder-check" class="w-4 h-4"></i>
            <span>Document Vault</span>
          </button>
          <button onclick="switchTab('settings')" id="nav-settings" class="nav-tab-btn inline-flex items-center gap-2 px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold transition cursor-pointer">
            <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
            <span>Preferences</span>
          </button>
        </nav>

        <div id="vehicle-pills" class="hidden lg:flex items-center gap-1.5 overflow-x-auto no-scrollbar"></div>
      </div>
    </div>
  </header>

  <!-- Toast Notification Banner -->
  <div id="toast-container" class="pointer-events-none fixed bottom-5 right-5 z-50 flex flex-col gap-2">
    <div id="toast-pill" class="hidden items-center gap-2.5 bg-slate-900 text-white text-xs sm:text-sm font-medium px-4 py-3 rounded-xl shadow-xl border border-slate-700/80 transition-all">
      <span id="toast-icon" class="text-emerald-400 font-bold">✓</span>
      <span id="toast-message">Saved successfully</span>
    </div>
  </div>

  <!-- Main Workspace Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <section id="kpi-strip" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></section>
    <section id="main-content" class="space-y-6"></section>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 mt-auto">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-500">
      <p><strong>AutoCare LK</strong> — GitHub Pages &amp; Supabase Cloud Sync Ready.</p>
      <p>Sri Lanka Compliance: Motor Insurance • Revenue License (eRL 2.0) • Emission Test (VET)</p>
    </div>
  </footer>

  <!-- Centered Responsive Modal Dialog -->
  <div id="modal-overlay" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-40 flex items-center justify-center p-4 animate-modal-bg" onclick="closeModalOnBackdrop(event)">
    <div id="modal-sheet" class="bg-white w-full max-w-lg max-h-[90vh] rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden animate-modal-card" onclick="event.stopPropagation()">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50/70 shrink-0">
        <h3 id="modal-title" class="text-base font-bold text-slate-900">Modal Title</h3>
        <button onclick="closeModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 transition cursor-pointer" aria-label="Close modal">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div id="modal-body" class="p-5 overflow-y-auto space-y-4"></div>
      <div id="modal-footer" class="px-5 py-3.5 border-t border-slate-200 bg-slate-50/70 flex items-center justify-end gap-2.5 shrink-0">
        <button onclick="closeModal()" class="px-4 py-2 rounded-xl border border-slate-300 bg-white hover:bg-slate-50 text-xs sm:text-sm font-semibold text-slate-700 transition cursor-pointer">Cancel</button>
        <button id="modal-save-btn" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-xs sm:text-sm font-bold text-white shadow-xs transition cursor-pointer">Save Changes</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. SUPABASE CONFIGURATION (PASTE YOUR CREDENTIALS HERE FOR GITHUB PAGES)
    // =========================================================================
    const HARDCODED_SUPABASE_URL = 'https://pdthlbnlfeqqsovqjwgo.supabase.co';      // e.g., 'https://pdthlbnlfeqqsovqjwgo.supabase.co'
    const HARDCODED_SUPABASE_ANON_KEY = 'sb_publishable_CIi_x9odWF9sc18_nS8rfA_0ocP4kfF'; // e.g., 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'

    const STORAGE_KEY = 'autocare_lk_crossbrowser_v2';
    const SB_CONFIG_KEY = 'autocare_lk_supabase_cfg';

    let supabaseClient = null;
    let isCloudConnected = false;

    function getSupabaseCredentials() {
      if (HARDCODED_SUPABASE_URL && HARDCODED_SUPABASE_ANON_KEY) {
        return { url: HARDCODED_SUPABASE_URL, key: HARDCODED_SUPABASE_ANON_KEY };
      }
      try {
        const saved = JSON.parse(localStorage.getItem(SB_CONFIG_KEY) || '{}');
        if (saved.url && saved.key) return saved;
      } catch (e) {}
      return null;
    }

    function initSupabaseClient() {
      const creds = getSupabaseCredentials();
      if (!creds || !window.supabase) {
        supabaseClient = null;
        isCloudConnected = false;
        updateDbBadge();
        return false;
      }
      try {
        supabaseClient = window.supabase.createClient(creds.url, creds.key);
        isCloudConnected = true;
        updateDbBadge();
        return true;
      } catch (e) {
        console.error('Supabase init error:', e);
        supabaseClient = null;
        isCloudConnected = false;
        updateDbBadge();
        return false;
      }
    }

    function updateDbBadge() {
      const badge = document.getElementById('db-status-badge');
      if (!badge) return;
      if (isCloudConnected) {
        badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200';
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span><span>Supabase Synced</span>`;
      } else {
        badge.className = 'inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-amber-50 text-amber-700 border border-amber-200';
        badge.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span><span>Local Cache Only</span>`;
      }
    }

    // Map JS camelCase vehicle object <-> Postgres snake_case row
    function toDbRow(v) {
      return {
        id: v.id,
        plate: v.plate,
        make_model: v.makeModel,
        year: Number(v.year || 2020),
        fuel_type: v.fuelType || 'Petrol',
        odometer: Number(v.odometer || 0),
        service_interval_km: Number(v.serviceIntervalKm || 5000),
        service_interval_months: Number(v.serviceIntervalMonths || 6),
        last_service_date: v.lastServiceDate || null,
        last_service_odometer: Number(v.lastServiceOdometer || 0),
        insurance_expiry: v.insuranceExpiry || null,
        insurance_provider: v.insuranceProvider || '',
        insurance_policy_no: v.insurancePolicyNo || '',
        revenue_license_expiry: v.revenueLicenseExpiry || null,
        vet_expiry: v.vetExpiry || null,
        notes: v.notes || '',
        service_logs: v.serviceLogs || [],
        documents: v.documents || { insurance: null, revenueLicense: null, vet: null, crBook: null }
      };
    }

    function fromDbRow(row) {
      return {
        id: row.id,
        plate: row.plate,
        makeModel: row.make_model,
        year: row.year,
        fuelType: row.fuel_type,
        odometer: row.odometer,
        serviceIntervalKm: row.service_interval_km,
        serviceIntervalMonths: row.service_interval_months,
        lastServiceDate: row.last_service_date || '',
        lastServiceOdometer: row.last_service_odometer,
        insuranceExpiry: row.insurance_expiry || '',
        insuranceProvider: row.insurance_provider || '',
        insurancePolicyNo: row.insurance_policy_no || '',
        revenueLicenseExpiry: row.revenue_license_expiry || '',
        vetExpiry: row.vet_expiry || '',
        notes: row.notes || '',
        serviceLogs: row.service_logs || [],
        documents: row.documents || { insurance: null, revenueLicense: null, vet: null, crBook: null }
      };
    }

    // =========================================================================
    // 2. STATE MANAGEMENT & CLOUD SYNC OPERATIONS
    // =========================================================================
    function getRelativeDate(daysOffset) {
      const d = new Date();
      d.setDate(d.getDate() + daysOffset);
      return d.toISOString().split('T')[0];
    }

    const DEFAULT_DATA = {
      selectedVehicleId: 'veh-1',
      reminderLeadDays: 30,
      reminderLeadKm: 1000,
      vehicles: [
        {
          id: 'veh-1',
          plate: 'WP CBG-4821',
          makeModel: 'Toyota Aqua G-Grade',
          year: 2018,
          fuelType: 'Hybrid',
          odometer: 78450,
          serviceIntervalKm: 5000,
          serviceIntervalMonths: 6,
          lastServiceDate: getRelativeDate(-155),
          lastServiceOdometer: 74200,
          insuranceExpiry: getRelativeDate(18),
          insuranceProvider: 'Sri Lanka Insurance (SLIC)',
          insurancePolicyNo: 'MTR/WP/2026/88412',
          revenueLicenseExpiry: getRelativeDate(42),
          vetExpiry: getRelativeDate(22),
          notes: 'Use 0W-20 Fully Synthetic Oil. Hybrid battery cooling filter cleaned at 70,000 km.',
          serviceLogs: [
            {
              id: 'srv-101',
              date: getRelativeDate(-155),
              odometer: 74200,
              type: 'Full Lubrication Service',
              garage: 'AutoMiraj - Nugegoda',
              cost: 24500,
              notes: '0W-20 Toyota Genuine Oil, Oil Filter, Air Filter, Brake Inspection'
            }
          ],
          documents: { insurance: null, revenueLicense: null, vet: null, crBook: null }
        },
        {
          id: 'veh-2',
          plate: 'WP CAX-9104',
          makeModel: 'Honda Vezel RS Sensing',
          year: 2017,
          fuelType: 'Hybrid',
          odometer: 94850,
          serviceIntervalKm: 5000,
          serviceIntervalMonths: 6,
          lastServiceDate: getRelativeDate(-90),
          lastServiceOdometer: 90100,
          insuranceExpiry: getRelativeDate(145),
          insuranceProvider: 'Ceylinco General Insurance',
          insurancePolicyNo: 'VIP/09/442190',
          revenueLicenseExpiry: getRelativeDate(-4),
          vetExpiry: getRelativeDate(110),
          notes: 'Dual-clutch actuator fluid changed at 85,000 km.',
          serviceLogs: [],
          documents: { insurance: null, revenueLicense: null, vet: null, crBook: null }
        }
      ]
    };

    let appState = loadLocalState();
    let currentTab = 'overview';
    let serviceSearchQuery = '';

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
        const parsed = JSON.parse(raw);
        if (!parsed.vehicles || !Array.isArray(parsed.vehicles)) {
          return JSON.parse(JSON.stringify(DEFAULT_DATA));
        }
        return parsed;
      } catch (e) {
        return JSON.parse(JSON.stringify(DEFAULT_DATA));
      }
    }

    function saveLocalCache() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
      } catch (e) {
        console.warn('Local cache quota exceeded:', e);
      }
    }

    async function fetchVehiclesFromSupabase(seedIfEmpty = false) {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient
          .from('vehicles')
          .select('*')
          .order('created_at', { ascending: true });

        if (error) throw error;

        if (data && data.length > 0) {
          appState.vehicles = data.map(fromDbRow);
          if (!appState.vehicles.some(v => v.id === appState.selectedVehicleId)) {
            appState.selectedVehicleId = appState.vehicles[0].id;
          }
          saveLocalCache();
          renderApp();
        } else if (seedIfEmpty && appState.vehicles.length > 0) {
          // Push initial sample fleet to Supabase on first connection
          await pushAllVehiclesToSupabase();
        }
      } catch (err) {
        console.error('Supabase fetch failed:', err);
        showToast('Supabase fetch error: ' + err.message, '⚠️');
      }
    }

    async function syncVehicleToSupabase(vehicle) {
      saveLocalCache();
      if (!supabaseClient || !vehicle) return;
      try {
        const { error } = await supabaseClient
          .from('vehicles')
          .upsert(toDbRow(vehicle), { onConflict: 'id' });
        if (error) throw error;
      } catch (err) {
        console.error('Supabase upsert failed:', err);
        showToast('Cloud sync failed: ' + err.message, '⚠️');
      }
    }

    async function deleteVehicleFromSupabase(vehicleId) {
      saveLocalCache();
      if (!supabaseClient) return;
      try {
        const { error } = await supabaseClient
          .from('vehicles')
          .delete()
          .eq('id', vehicleId);
        if (error) throw error;
      } catch (err) {
        console.error('Supabase delete failed:', err);
        showToast('Cloud delete failed: ' + err.message, '⚠️');
      }
    }

    async function pushAllVehiclesToSupabase() {
      if (!supabaseClient) return;
      try {
        const rows = appState.vehicles.map(toDbRow);
        if (rows.length === 0) return;
        const { error } = await supabaseClient
          .from('vehicles')
          .upsert(rows, { onConflict: 'id' });
        if (error) throw error;
        showToast(`Synced ${rows.length} vehicle(s) to Supabase`);
      } catch (err) {
        showToast('Sync failed: ' + err.message, '⚠️');
      }
    }

    function getActiveVehicle() {
      return appState.vehicles.find(v => v.id === appState.selectedVehicleId) || appState.vehicles[0];
    }

    // =========================================================================
    // 3. DATE, MILEAGE & COMPLIANCE CALCULATION ENGINE
    // =========================================================================
    function daysUntil(dateStr) {
      if (!dateStr) return null;
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const target = new Date(dateStr + 'T00:00:00');
      const diffMs = target - today;
      return Math.ceil(diffMs / (1000 * 60 * 60 * 24));
    }

    function addMonths(dateStr, months) {
      if (!dateStr) return getRelativeDate(180);
      const d = new Date(dateStr + 'T00:00:00');
      d.setMonth(d.getMonth() + Number(months));
      return d.toISOString().split('T')[0];
    }

    function formatDateSL(dateStr) {
      if (!dateStr) return 'Not Set';
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function formatCurrencyLKR(amount) {
      return 'Rs. ' + Number(amount || 0).toLocaleString('en-LK');
    }

    function getExpiryStatus(days) {
      if (days === null) return { level: 'none', label: 'Not Set', badgeBg: 'bg-slate-100 text-slate-600 border-slate-200' };
      if (days < 0) return { level: 'overdue', label: `Overdue ${Math.abs(days)}d`, badgeBg: 'bg-red-50 text-red-700 border-red-200' };
      if (days === 0) return { level: 'overdue', label: 'Expires Today', badgeBg: 'bg-red-50 text-red-700 border-red-200' };
      if (days <= appState.reminderLeadDays) return { level: 'soon', label: `Due in ${days}d`, badgeBg: 'bg-amber-50 text-amber-800 border-amber-200' };
      return { level: 'ok', label: `Valid (${days}d left)`, badgeBg: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
    }

    function getServiceMetrics(vehicle) {
      const intervalKm = Math.max(1, Number(vehicle.serviceIntervalKm || 5000));
      const intervalMonths = Math.max(1, Number(vehicle.serviceIntervalMonths || 6));
      const nextServiceKm = Number(vehicle.lastServiceOdometer) + intervalKm;
      const kmRemaining = nextServiceKm - Number(vehicle.odometer);
      const kmUsed = Number(vehicle.odometer) - Number(vehicle.lastServiceOdometer);
      const kmProgress = Math.min(100, Math.max(0, Math.round((kmUsed / intervalKm) * 100)));

      const nextServiceDate = addMonths(vehicle.lastServiceDate, intervalMonths);
      const daysRemaining = daysUntil(nextServiceDate);
      const totalServiceDays = Math.max(1, Math.round(intervalMonths * 30.4));
      const daysElapsed = totalServiceDays - daysRemaining;
      const timeProgress = Math.min(100, Math.max(0, Math.round((daysElapsed / totalServiceDays) * 100)));

      let status = 'ok';
      let triggerReason = kmProgress >= timeProgress ? 'Mileage limit approaching first' : 'Time interval approaching first';

      if (kmRemaining <= 0 || daysRemaining <= 0) {
        status = 'overdue';
        triggerReason = kmRemaining <= 0 ? 'Odometer limit exceeded' : 'Time interval exceeded';
      } else if (kmRemaining <= appState.reminderLeadKm || daysRemaining <= appState.reminderLeadDays) {
        status = 'soon';
        triggerReason = kmRemaining <= appState.reminderLeadKm
          ? `Only ${kmRemaining.toLocaleString()} km remaining`
          : `Due in ${daysRemaining} days`;
      }

      return { nextServiceKm, kmRemaining, kmProgress, nextServiceDate, daysRemaining, timeProgress, status, triggerReason };
    }

    function getVehicleAlertCount(vehicle) {
      let count = 0;
      const srv = getServiceMetrics(vehicle);
      if (srv.status !== 'ok') count++;
      if (daysUntil(vehicle.insuranceExpiry) <= appState.reminderLeadDays) count++;
      if (daysUntil(vehicle.revenueLicenseExpiry) <= appState.reminderLeadDays) count++;
      if (vehicle.fuelType !== 'Electric' && daysUntil(vehicle.vetExpiry) <= appState.reminderLeadDays) count++;
      return count;
    }

    // =========================================================================
    // 4. UI RENDERING ENGINE
    // =========================================================================
    function renderApp() {
      renderVehicleControls();
      updateNavTabs();
      renderKpiStrip();

      const main = document.getElementById('main-content');
      const vehicle = getActiveVehicle();

      if (!vehicle) {
        main.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-12 text-center space-y-4 max-w-xl mx-auto shadow-xs my-8">
            <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 flex items-center justify-center mx-auto">
              <i data-lucide="car" class="w-6 h-6"></i>
            </div>
            <div class="space-y-1">
              <h2 class="text-lg font-extrabold text-slate-900">No Vehicles in Fleet</h2>
              <p class="text-xs text-slate-500">Register your vehicle to track maintenance schedules, Motor Insurance, Revenue License, and Emission Test expiries.</p>
            </div>
            <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
              <button onclick="openVehicleModal()" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-xs transition cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Add Vehicle</span>
              </button>
              <button onclick="resetDemoData()" class="inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold transition cursor-pointer">
                Restore Sample Fleet
              </button>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      if (currentTab === 'overview') main.innerHTML = renderOverviewView(vehicle);
      else if (currentTab === 'service') main.innerHTML = renderServiceView(vehicle);
      else if (currentTab === 'vault') main.innerHTML = renderVaultView(vehicle);
      else if (currentTab === 'settings') main.innerHTML = renderSettingsView(vehicle);

      lucide.createIcons();
    }

    function updateNavTabs() {
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        btn.classList.remove('bg-blue-50', 'text-blue-700');
        btn.classList.add('text-slate-600', 'hover:bg-slate-100', 'hover:text-slate-900');
      });
      const activeBtn = document.getElementById(`nav-${currentTab}`);
      if (activeBtn) {
        activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-100', 'hover:text-slate-900');
        activeBtn.classList.add('bg-blue-50', 'text-blue-700');
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      renderApp();
    }

    function selectVehicle(id) {
      appState.selectedVehicleId = id;
      saveLocalCache();
      renderApp();
    }

    function renderVehicleControls() {
      const dropdown = document.getElementById('vehicle-dropdown');
      const pills = document.getElementById('vehicle-pills');

      if (!appState.vehicles || appState.vehicles.length === 0) {
        dropdown.innerHTML = `<option value="">No vehicles</option>`;
        pills.innerHTML = '';
        return;
      }

      dropdown.innerHTML = appState.vehicles.map(v => {
        const alerts = getVehicleAlertCount(v);
        return `<option value="${v.id}" ${v.id === appState.selectedVehicleId ? 'selected' : ''}>
          ${v.plate} — ${v.makeModel}${alerts > 0 ? ` (${alerts} alert${alerts > 1 ? 's' : ''})` : ''}
        </option>`;
      }).join('');

      pills.innerHTML = appState.vehicles.map(v => {
        const isSelected = v.id === appState.selectedVehicleId;
        const alerts = getVehicleAlertCount(v);
        return `
          <button onclick="selectVehicle('${v.id}')"
            class="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer ${
              isSelected ? 'bg-slate-900 text-white shadow-xs' : 'bg-slate-100 text-slate-600 hover:bg-slate-200/80'
            }">
            <span>${v.plate}</span>
            ${alerts > 0 ? `<span class="px-1.5 py-0.2 rounded-full text-[10px] font-extrabold ${isSelected ? 'bg-amber-400 text-slate-950' : 'bg-red-500 text-white'}">${alerts}</span>` : ''}
          </button>
        `;
      }).join('');
    }

    function renderKpiStrip() {
      const container = document.getElementById('kpi-strip');
      const v = getActiveVehicle();
      if (!v) { container.innerHTML = ''; return; }

      const srv = getServiceMetrics(v);
      const activeAlerts = getVehicleAlertCount(v);
      const complianceItems = [
        { name: 'Insurance', days: daysUntil(v.insuranceExpiry), date: v.insuranceExpiry },
        { name: 'Revenue License', days: daysUntil(v.revenueLicenseExpiry), date: v.revenueLicenseExpiry }
      ];
      if (v.fuelType !== 'Electric') {
        complianceItems.push({ name: 'Emission (VET)', days: daysUntil(v.vetExpiry), date: v.vetExpiry });
      }
      complianceItems.sort((a, b) => (a.days ?? 9999) - (b.days ?? 9999));
      const nearestDoc = complianceItems[0];

      const healthBadge = activeAlerts === 0
        ? { label: 'All Clear', bg: 'bg-emerald-50 text-emerald-700 border-emerald-200' }
        : { label: `${activeAlerts} Action${activeAlerts > 1 ? 's' : ''} Needed`, bg: 'bg-amber-50 text-amber-800 border-amber-200' };

      container.innerHTML = `
        <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-500">Active Vehicle Health</span>
            <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${healthBadge.bg}">${healthBadge.label}</span>
          </div>
          <div class="mt-2.5 flex items-baseline justify-between">
            <div>
              <p class="text-lg font-extrabold text-slate-900">${v.plate}</p>
              <p class="text-xs text-slate-500 truncate max-w-[180px]">${v.makeModel}</p>
            </div>
            <span class="text-xs font-semibold text-slate-400">Fleet: ${appState.vehicles.length} veh</span>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-500">Next Statutory Expiry</span>
            <i data-lucide="shield-alert" class="w-4 h-4 ${nearestDoc.days <= appState.reminderLeadDays ? 'text-amber-500' : 'text-emerald-500'}"></i>
          </div>
          <div class="mt-2.5">
            <p class="text-lg font-extrabold ${nearestDoc.days < 0 ? 'text-red-600' : nearestDoc.days <= appState.reminderLeadDays ? 'text-amber-600' : 'text-slate-900'}">
              ${nearestDoc.days < 0 ? `Overdue by ${Math.abs(nearestDoc.days)}d` : `${nearestDoc.days} days left`}

            <p class="text-xs text-slate-500">${nearestDoc.name} • ${formatDateSL(nearestDoc.date)}</p>
          </div>
        </div>

        <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-500">Next Service Target</span>
            <i data-lucide="gauge" class="w-4 h-4 ${srv.status === 'overdue' ? 'text-red-500' : srv.status === 'soon' ? 'text-amber-500' : 'text-blue-600'}"></i>
          </div>
          <div class="mt-2.5">
            <p class="text-lg font-extrabold ${srv.kmRemaining <= 0 ? 'text-red-600' : srv.kmRemaining <= appState.reminderLeadKm ? 'text-amber-600' : 'text-slate-900'}">

            <p class="text-xs text-slate-500">At ${srv.nextServiceKm.toLocaleString()} km or ${formatDateSL(srv.nextServiceDate)}</p>

        </div>

        <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-xs flex flex-col justify-between">
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-500">Current Odometer</span>
            <button onclick="openOdometerModal()" class="text-xs font-bold text-blue-600 hover:text-blue-700 hover:underline cursor-pointer">Update km →</button>

          <div class="mt-2.5 flex items-baseline justify-between">
            <p class="text-lg font-extrabold text-slate-900 tabular-nums">${Number(v.odometer).toLocaleString()} <span class="text-xs font-semibold text-slate-500">km</span></p>
            <button onclick="openLogServiceModal()" class="px-2.5 py-1 rounded-lg bg-blue-50 hover:bg-blue-100 text-blue-700 text-xs font-bold transition cursor-pointer">+ Log Service</button>
          </div>
        </div>
      `;
    }

            <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-xs space-y-5">

                  </div>
                  <div>

                  </div>

                <span class="px-2.5 py-1 rounded-full text-xs font-bold border ${insStatus.badgeBg}">${insStatus.label}</span>

                <div>
                  <span class="text-slate-400">Expiry:</span>
                  <strong class="text-slate-800 ml-1">${formatDateSL(v.insuranceExpiry)}</strong>
                </div>
                <button onclick="openQuickRenewModal('insurance')" class="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-blue-50 text-slate-700 hover:text-blue-700 font-bold transition cursor-pointer">
                  Renew
                </button>
              </div>
            </div>

            <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-xs space-y-3">
              <div class="flex items-start justify-between gap-3">
                <div class="flex items-center gap-3">

    function renderServiceView(v) {
      const allLogs = v.serviceLogs || [];
      const filteredLogs = allLogs.filter(log => {
        if (!serviceSearchQuery) return true;
        const q = serviceSearchQuery.toLowerCase();
        return (log.type || '').toLowerCase().includes(q) || (log.garage || '').toLowerCase().includes(q);
      });
      const totalSpent = allLogs.reduce((sum, item) => sum + Number(item.cost || 0), 0);

      return `
        <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-xs space-y-5">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <h2 class="text-lg font-extrabold text-slate-900">Service Log — ${v.plate}</h2>
              <p class="text-xs text-slate-500">Total spend: <strong class="text-slate-800">${formatCurrencyLKR(totalSpent)}</strong> across ${allLogs.length} entries</p>
            </div>
            <div class="flex flex-wrap items-center gap-2.5">
              <input type="text" value="${serviceSearchQuery}" oninput="handleServiceSearch(this.value)" placeholder="Search garage, oil..."
                class="px-3.5 py-2 rounded-xl border border-slate-300 text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
              <button onclick="openLogServiceModal()" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs sm:text-sm font-bold shadow-xs transition cursor-pointer">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>Log Service</span>
              </button>
            </div>
          </div>

          ${filteredLogs.length === 0 ? `
            <div class="border-2 border-dashed border-slate-200 rounded-2xl p-10 text-center space-y-2">
              <p class="text-sm font-bold text-slate-700">No service records found</p>
              <p class="text-xs text-slate-500">Click "Log Service" to record maintenance costs and parts.</p>
            </div>
          ` : `
            <div class="overflow-x-auto rounded-xl border border-slate-200">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-[11px] font-bold uppercase tracking-wider text-slate-500">
                    <th class="py-3 px-4">Date</th>
                    <th class="py-3 px-4">Odometer</th>
                    <th class="py-3 px-4">Type</th>
                    <th class="py-3 px-4">Garage</th>
                    <th class="py-3 px-4">Notes</th>
                    <th class="py-3 px-4 text-right">Cost (LKR)</th>
                    <th class="py-3 px-4 text-right">Action</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-xs sm:text-sm">
                  ${filteredLogs.map(log => `
                    <tr class="hover:bg-slate-50/80 transition">
                      <td class="py-3.5 px-4 font-semibold text-slate-900">${formatDateSL(log.date)}</td>
                      <td class="py-3.5 px-4 font-bold text-blue-600 tabular-nums">${Number(log.odometer).toLocaleString()} km</td>
                      <td class="py-3.5 px-4 font-bold text-slate-800">${log.type}</td>
                      <td class="py-3.5 px-4 text-slate-600">${log.garage || '—'}</td>
                      <td class="py-3.5 px-4 text-slate-500 max-w-xs">${log.notes || '—'}</td>
                      <td class="py-3.5 px-4 text-right font-extrabold text-slate-900">${formatCurrencyLKR(log.cost)}</td>
                      <td class="py-3.5 px-4 text-right">
                        <button onclick="deleteServiceLog('${log.id}')" class="text-xs font-semibold text-red-600 hover:underline cursor-pointer">Delete</button>
                      </td>

    function openModal(title, bodyHtml, onSave, saveLabel = 'Save Changes', isDanger = false) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      const footer = document.getElementById('modal-footer');
      const saveBtn = document.getElementById('modal-save-btn');
      if (onSave) {
        footer.classList.remove('hidden');
        saveBtn.textContent = saveLabel;
        saveBtn.className = isDanger
          ? 'px-4 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-xs sm:text-sm font-bold text-white shadow-xs transition cursor-pointer'
          : 'px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-xs sm:text-sm font-bold text-white shadow-xs transition cursor-pointer';
        saveBtn.onclick = onSave;
      } else {
        footer.classList.add('hidden');
      }
      document.getElementById('modal-overlay').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.add('hidden');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'modal-overlay') closeModal();
    }

    function openSupabaseModal() {
      const creds = getSupabaseCredentials() || { url: '', key: '' };
      const body = `
        <div class="space-y-3">
          <div class="p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-xs text-emerald-900">
            Enter your Supabase <strong>Project URL</strong> and <strong>anon public API key</strong>. Data will automatically sync to your <code>vehicles</code> table.
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Supabase Project URL</label>
            <input id="sb-url" type="url" value="${creds.url}" placeholder="https://your-project-id.supabase.co" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs font-mono" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Supabase Anon Public Key</label>
            <input id="sb-key" type="password" value="${creds.key}" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-xs font-mono" />
          </div>
        </div>
      `;

      openModal('Connect Supabase Central Database', body, async () => {
        const url = document.getElementById('sb-url').value.trim();
        const key = document.getElementById('sb-key').value.trim();
        if (!url || !key) {
          localStorage.removeItem(SB_CONFIG_KEY);
          initSupabaseClient();
          closeModal();
          showToast('Disconnected from Supabase');
          return;
        }
        localStorage.setItem(SB_CONFIG_KEY, JSON.stringify({ url, key }));
        if (initSupabaseClient()) {
          closeModal();
          showToast('Connected! Syncing with Supabase...');
          await fetchVehiclesFromSupabase(true);
        } else {
          showToast('Invalid Supabase credentials', '⚠️');
        }
      }, 'Connect & Sync');
    }

    function confirmDeleteVehicle(vehicleId) {
      const target = appState.vehicles.find(item => item.id === vehicleId);

      const body = `
        <div class="space-y-3">

            <p class="text-sm font-extrabold">Remove ${target.plate} (${target.makeModel})?</p>
            <p class="text-xs text-red-800">This will permanently delete this vehicle from your browser cache and Supabase database.</p>
          </div>
        </div>
      `;

      openModal(`Remove Vehicle — ${target.plate}`, body, async () => {
        appState.vehicles = appState.vehicles.filter(item => item.id !== vehicleId);

          <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2">
            <h4 class="text-xs font-extrabold uppercase text-slate-600">Import JSON Backup</h4>
            <input type="file" accept="application/json" onchange="importJsonBackup(event)" class="block w-full text-xs text-slate-600 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 cursor-pointer" />
          </div>
        </div>
      `;
      openModal('Backup / Restore Data', body, null);
    }

    function exportJsonBackup() {
      const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `autocare_lk_backup_${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup downloaded');
    }

    function importJsonBackup(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed.vehicles) return showToast('Invalid backup file', '⚠️');
          appState = parsed;
          saveLocalCache();
          await pushAllVehiclesToSupabase();
          closeModal();
          renderApp();
          showToast('Fleet restored');
        } catch (err) {
          showToast('Failed to read backup', '⚠️');
        }
      };
      reader.readAsText(file);
    }

    function handleDocUpload(event, docKey) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = async function() {
          const canvas = document.createElement('canvas');
          const maxDim = 900;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          const v = getActiveVehicle();
          v.documents = v.documents || {};
          v.documents[docKey] = canvas.toDataURL('image/jpeg', 0.72);
          await syncVehicleToSupabase(v);
          renderApp();
          showToast('Document uploaded & synced');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function removeDocFile(docKey) {
      const v = getActiveVehicle();
      if (v.documents) v.documents[docKey] = null;
      await syncVehicleToSupabase(v);
      renderApp();
      showToast('Document removed');
    }

    function openDocPreviewModal(title, docKey) {
      const v = getActiveVehicle();
      const src = v.documents && v.documents[docKey];
      if (!src) return;
      openModal(title, `<img src="${src}" class="w-full max-h-[70vh] object-contain rounded-xl" />`, null);
    }

    function updateSetting(key, val) {
      appState[key] = val;
      saveLocalCache();
      renderApp();
      showToast('Reminder threshold updated');
    }

    async function resetDemoData() {
      appState = JSON.parse(JSON.stringify(DEFAULT_DATA));
      saveLocalCache();
      await pushAllVehiclesToSupabase();
      currentTab = 'overview';
      renderApp();
      showToast('Sample Sri Lankan fleet restored');
    }

    let toastTimeout;
    function showToast(msg, icon = '✓') {
      const pill = document.getElementById('toast-pill');
      document.getElementById('toast-message').textContent = msg;
      document.getElementById('toast-icon').textContent = icon;
      pill.classList.remove('hidden');
      pill.classList.add('flex');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        pill.classList.add('hidden');
        pill.classList.remove('flex');
      }, 2800);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      initSupabaseClient();
      renderApp();
      if (isCloudConnected) {
        await fetchVehiclesFromSupabase(true);
      }
    });
  </script>
</body>
</html>
